name: Avocado connect login (GitHub OIDC)
description: Exchange the GitHub Actions OIDC id-token for a short-lived connect token in one organization and log the avocado CLI in. Keyless — no stored secret.
branding:
  icon: log-in
  color: green
inputs:
  organization:
    description: Connect organization id (UUID) to get a token for. An org admin must have created a CI trust for this repository in it.
    required: true
  connect-url:
    description: avocado-connect base URL.
    required: false
    default: https://connect.peridio.com
  audience:
    description: Audience to request the OIDC id-token with (must match the server's configured audience).
    required: false
    default: avocado-connect
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CONNECT_URL: ${{ inputs.connect-url }}
        AUDIENCE: ${{ inputs.audience }}
        ORGANIZATION: ${{ inputs.organization }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::OIDC unavailable — the calling job needs 'permissions: id-token: write'" >&2
          exit 1
        fi
        if ! command -v avocado >/dev/null 2>&1; then
          echo "::error::avocado CLI not on PATH — run avocado-linux/actions/setup-avocado-cli first" >&2
          exit 1
        fi
        # 1. Ask the GitHub OIDC provider for an id-token scoped to our audience.
        idtoken="$(curl -sSfL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')"
        if [ -z "$idtoken" ] || [ "$idtoken" = "null" ]; then
          echo "::error::failed to obtain a GitHub OIDC id-token" >&2
          exit 1
        fi
        if [ -z "${ORGANIZATION}" ]; then
          echo "::error::the 'organization' input is required (the connect organization id)" >&2
          exit 1
        fi
        # 2. Exchange it at connect for a short-lived token in that organization.
        body="$(mktemp)"
        status="$(curl -sS -o "$body" -w '%{http_code}' -X POST "${CONNECT_URL}/auth/github-actions/exchange" \
          -H 'content-type: application/json' \
          -d "$(jq -nc --arg t "$idtoken" --arg o "$ORGANIZATION" '{token: $t, organization_id: $o}')")"
        if [ "$status" != 200 ]; then
          msg="$(jq -r '.message // empty' "$body" 2>/dev/null)"
          echo "::error::connect refused the exchange (HTTP ${status}): ${msg:-no message}. An org admin creates the CI trust with POST /api/orgs/<org>/ci-trusts." >&2
          exit 1
        fi
        token="$(jq -r '.data.token' "$body")"
        if [ -z "$token" ] || [ "$token" = "null" ]; then
          echo "::error::connect answered 200 without a token" >&2
          exit 1
        fi
        echo "::add-mask::$token"
        # 3. Log the CLI in with the ephemeral token.
        avocado connect auth login --url "$CONNECT_URL" --token "$token"
